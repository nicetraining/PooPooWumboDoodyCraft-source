# One-off: removes the fogile release/tag and the inbox branch. Deleted again right after it ran.
name: Cleanup
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fogile --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/fogile" || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/inbox" || true
          gh release list --repo "$GITHUB_REPOSITORY"
