# Copies the files attached to a release onto the "inbox" branch, so they can be fetched with git.
# Used to hand over big files (jars to check) that are too large for chat. Started by hand.
name: Release files to inbox branch
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release whose attached files to copy"
        required: true
permissions:
  contents: write
jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release's files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir inbox && cd inbox
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          ls -la
      - name: Commit them to the inbox branch
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cd inbox
          git init -q -b inbox
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Files from release $TAG"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" inbox:inbox
