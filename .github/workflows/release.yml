name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew --no-daemon build # no clean: it deletes the expanded NeoForge ATs a cache-restored step needs

      - name: Collect jar
        run: |
          mkdir -p dist
          for f in build/libs/*.jar; do
            case "$f" in *-slim.jar) ;; *) cp "$f" "dist/$(basename "$f" | tr ' ' '-')" ;; esac
          done
          ls dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
